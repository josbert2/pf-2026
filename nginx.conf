# Rendered by the nginx image's envsubst at container start.
# Only ASSET_BASE_URL is substituted (NGINX_ENVSUBST_FILTER in compose),
# so nginx's own $uri / $request_uri survive.
# ── Language detection ─────────────────────────────────────────────────────
# English pages live at /, /work, /about; Spanish under /es. The `lang` cookie
# (set by the site's EN/ES switcher) always wins; without it, a browser whose
# first preferred language is Spanish goes to /es. No cookie and no
# Accept-Language (crawlers) → English, so both versions stay indexable.
map "$cookie_lang|$http_accept_language" $prefers_es {
    default   0;
    "~^es\|"  1;
    "~^en\|"  0;
    "~*^\|\s*es" 1;
}
# Spanish twin of an English page: "/" → "/es", "/work" → "/es/work".
map $uri $es_uri {
    /       /es;
    default /es$uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers so redirects keep the host:port the client used.
    absolute_redirect off;

    # Baseline security headers (no restrictive CSP — the site pulls fonts/images
    # from external CDNs, so a strict policy would need curation first).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → Hono service (compose service name "api").
    location /api/ {
        client_max_body_size 10m;  # CMS image uploads (API caps at 8 MB)
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portfolio images/assets. Set ASSET_BASE_URL (Cloudflare R2 public URL /
    # CDN) to offload them; leave it empty to serve from the bundle.
    location /work-clone/ {
        set $asset_base "${ASSET_BASE_URL}";
        if ($asset_base != "") {
            return 302 $asset_base$request_uri;
        }
        try_files $uri =404;
    }

    # Hashed build assets — long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Shortcut: Connect is a home-page anchor, make the obvious URL work.
    # CMS panel: never indexed. add_header here replaces the server-level
    # ones, so the baseline headers are repeated.
    location = /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-store" always;
        try_files /admin.html =404;
    }

    location = /connect {
        return 302 /#connect;
    }

    # English pages: send Spanish speakers to their twin (see the maps above).
    location ~ ^/(work|about)?$ {
        if ($prefers_es) {
            return 302 $es_uri$is_args$args;
        }
        try_files $uri $uri.html /index.html =404;
    }

    # Prerendered multi-page output: /work → work.html. Unknown paths get the
    # prerendered 404 page with a real 404 status (all routes are prerendered,
    # so no SPA fallback to index.html is needed).
    error_page 404 /404.html;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
