# Rendered by the nginx image's envsubst at container start.
# Only ASSET_BASE_URL is substituted (NGINX_ENVSUBST_FILTER in compose),
# so nginx's own $uri / $request_uri survive.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers so redirects keep the host:port the client used.
    absolute_redirect off;

    # Baseline security headers (no restrictive CSP — the site pulls fonts/images
    # from external CDNs, so a strict policy would need curation first).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → Hono service (compose service name "api").
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portfolio images/assets. Set ASSET_BASE_URL (Cloudflare R2 public URL /
    # CDN) to offload them; leave it empty to serve from the bundle.
    location /work-clone/ {
        set $asset_base "${ASSET_BASE_URL}";
        if ($asset_base != "") {
            return 302 $asset_base$request_uri;
        }
        try_files $uri =404;
    }

    # Hashed build assets — long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Shortcut: Connect is a home-page anchor, make the obvious URL work.
    location = /connect {
        return 302 /#connect;
    }

    # Prerendered multi-page output: /work → work.html. Unknown paths get the
    # prerendered 404 page with a real 404 status (all routes are prerendered,
    # so no SPA fallback to index.html is needed).
    error_page 404 /404.html;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
